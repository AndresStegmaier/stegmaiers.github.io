<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bioquímica</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101827;
            color: #F1F5F9;
            font-family: Arial, sans-serif;
        }

        #app {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pantalla {
            width: 1000px;
            min-height: 650px;
            padding: 35px;
            position: relative;
        }

        .titulo {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #AAB7C8;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .botones {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        button {
            border: none;
            background: #263A55;
            color: #F1F5F9;
            border-radius: 8px;
            padding: 18px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #345274;
            transform: translateY(-2px);
        }

        .boton-grande {
            width: 400px;
        }

        .fila-botones {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .boton-pequeno {
            width: 190px;
        }

        .volver {
            margin-top: 40px;
            width: 200px;
        }

        .centrado {
            display: flex;
            justify-content: center;
        }

        .temas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 45px;
        }

        .tema {
            min-height: 75px;
            font-size: 17px;
        }

        .conceptos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 45px;
        }

        .concepto {
            min-height: 65px;
        }

        .panel {
            background: #1E2A3D;
            border-radius: 10px;
            padding: 30px;
            margin-top: 30px;
            line-height: 1.7;
            white-space: pre-line;
        }

        .panel h2 {
            text-align: center;
            color: #60A5FA;
        }

        .pregunta {
            background: #1E2A3D;
            border-radius: 10px;
            padding: 30px;
            margin-top: 30px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .opciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .opcion {
            min-height: 65px;
        }

        .resultado {
            background: #1E2A3D;
            border-radius: 10px;
            padding: 35px;
            margin-top: 30px;
            text-align: center;
            line-height: 1.7;
        }

        .correcto {
            color: #36D399;
            font-size: 32px;
            font-weight: bold;
        }

        .incorrecto {
            color: #F87171;
            font-size: 32px;
            font-weight: bold;
        }

        .explicacion {
            margin-top: 25px;
            font-size: 17px;
        }

        .pista {
            color: #FBBF24;
            margin-top: 15px;
        }

        .barra {
            width: 450px;
            height: 24px;
            background: #263A55;
            border-radius: 20px;
            overflow: hidden;
        }

        .barra-progreso {
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s;
        }

        .fila-progreso {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 22px 0;
        }

        .nombre-tema {
            width: 180px;
            font-weight: bold;
        }

        .porcentaje {
            width: 60px;
            font-weight: bold;
        }

        .tarjeta {
            background: #1E2A3D;
            width: 700px;
            min-height: 280px;
            margin: 40px auto;
            border-radius: 12px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .tarjeta h2 {
            color: #60A5FA;
            font-size: 30px;
        }

        .tarjeta .definicion {
            white-space: pre-line;
            line-height: 1.7;
            font-size: 17px;
        }

        .nivel {
            text-align: center;
            font-size: 22px;
            margin: 25px;
        }

        .mensaje {
            text-align: center;
            color: #AAB7C8;
            margin-top: 30px;
        }

        @media (max-width: 800px) {

            .pantalla {
                width: 100%;
                min-height: 100vh;
                padding: 20px;
            }

            .temas,
            .conceptos,
            .opciones {
                grid-template-columns: 1fr;
            }

            .boton-grande {
                width: 90%;
            }

            .tarjeta {
                width: 95%;

                margin-top: 18px;
                text-align: center;
                color: #94A3B8;
                font-size: 14px;
                line-height: 1.6;
            }
        }

    </style>
</head>

        "Carbohidratos",
        "Lípidos",
        "Proteínas",
        "Vitaminas",
        "Ácidos nucleicos",
        "Metabolismo"

    const CONTENIDO = {

        "Carbohidratos": {

            introduccion: `
Los carbohidratos son biomoléculas formadas principalmente
por carbono, hidrógeno y oxígeno.

Una de sus funciones principales es proporcionar energía
a las células.

Se pueden clasificar según el número de unidades de azúcar:

• Monosacáridos
• Disacáridos
• Polisacáridos
            `,

            conceptos: {

                "Monosacáridos": `
Son carbohidratos formados por una sola unidad.

Ejemplos:

• Glucosa
• Fructosa
• Galactosa

La glucosa es especialmente importante porque puede utilizarse
para obtener energía mediante diferentes rutas metabólicas.
                `,

                "Disacáridos": `
Están formados por dos monosacáridos unidos mediante
un enlace glucosídico.

Ejemplos:

• Sacarosa = glucosa + fructosa
• Lactosa = glucosa + galactosa
• Maltosa = glucosa + glucosa
                `,

                "Polisacáridos": `
Están formados por muchas unidades de monosacáridos.

Ejemplos:

• Almidón → reserva energética en plantas.
• Glucógeno → reserva energética en animales.
• Celulosa → función estructural en plantas.
                `,

                "Funciones": `
Los carbohidratos pueden cumplir distintas funciones:

• Energética → glucosa.
• Reserva → almidón y glucógeno.
• Estructural → celulosa.

Una idea importante:

Glucosa → energía inmediata
Glucógeno → reserva en animales
Almidón → reserva en plantas
                `
            }
        },


        "Lípidos": {

            introduccion: `
Los lípidos son biomoléculas que generalmente presentan
baja solubilidad en agua.

Participan en:

• Almacenamiento de energía.
• Formación de membranas.
• Aislamiento térmico.
• Señalización celular.
            `,

            conceptos: {

                "Triglicéridos": `
Un triglicérido está formado por:

1 glicerol + 3 ácidos grasos

Su función principal es almacenar energía.
                `,

                "Fosfolípidos": `
Los fosfolípidos son componentes fundamentales de las

Poseen una región hidrofílica y regiones hidrofóbicas.

Esta característica permite que formen una bicapa lipídica.
                `,

                "Ácidos grasos": `
Los ácidos grasos son componentes de muchos lípidos.

Saturados:
No poseen dobles enlaces carbono-carbono.

Insaturados:
Poseen uno o más dobles enlaces carbono-carbono.
                `,

                "Colesterol": `
El colesterol es un lípido perteneciente a los esteroles.

Participa en:

• Membranas celulares.
• Síntesis de algunas hormonas.
• Síntesis de vitamina D.
• Síntesis de ácidos biliares.
                `
            }
        },


        "Proteínas": {

            introduccion: `
Las proteínas son polímeros formados por aminoácidos.

Los aminoácidos se unen mediante enlaces peptídicos.

Las proteínas pueden desempeñar funciones estructurales,
enzimáticas, defensivas, transportadoras y regulatorias.
            `,

            conceptos: {

                "Aminoácidos": `
Son las unidades básicas de las proteínas.

Todos los aminoácidos poseen:

• Grupo amino
• Grupo carboxilo
• Carbono alfa
• Hidrógeno
• Grupo R

El grupo R determina muchas de sus propiedades.
                `,

                "Enlace peptídico": `
Es el enlace que une aminoácidos.

Se forma entre el grupo carboxilo de un aminoácido
y el grupo amino de otro.

Durante su formación se libera una molécula de agua.
                `,

                "Estructura proteica": `
Las proteínas poseen cuatro niveles estructurales:

1. Primaria → secuencia de aminoácidos.
2. Secundaria → hélices alfa y láminas beta.
3. Terciaria → estructura tridimensional.
4. Cuaternaria → asociación de varias cadenas.
                `,

                "Enzimas": `
Las enzimas son catalizadores biológicos.

Aceleran reacciones químicas disminuyendo la energía
de activación necesaria para que ocurran.

No se consumen permanentemente durante la reacción.
                `
            }
        },


        "Vitaminas": {

            introduccion: `
Las vitaminas son micronutrientes necesarios para numerosas
funciones del organismo.

Se clasifican en dos grandes grupos:

Liposolubles:
A, D, E y K

Hidrosolubles:
Complejo B y C
            `,

            conceptos: {

                "Liposolubles": `
Las vitaminas liposolubles son:

A
D
E
K

Pueden almacenarse en el organismo con mayor facilidad.
                `,

                "Hidrosolubles": `
Las vitaminas hidrosolubles incluyen:

• Complejo B
• Vitamina C

En general presentan menor almacenamiento corporal.
                `,

                "Vitamina D": `
La vitamina D participa especialmente en la regulación
del metabolismo del calcio y fósforo.

Es importante para la salud ósea.
                `,

                "Vitamina C": `
La vitamina C participa en diferentes procesos,
incluyendo la síntesis de colágeno.

También posee función antioxidante.
                `
            }
        },


        "Ácidos nucleicos": {

            introduccion: `
Los ácidos nucleicos son biomoléculas fundamentales para
el almacenamiento y expresión de la información genética.

Los principales son:

• ADN
• ARN

Sus unidades básicas son los nucleótidos.
            `,

            conceptos: {

                "Nucleótidos": `
Un nucleótido está formado por:

• Base nitrogenada
• Azúcar
• Grupo fosfato

Los nucleótidos se unen para formar los ácidos nucleicos.
                `,

                "ADN": `
El ADN almacena la información genética.

Sus bases nitrogenadas son:

• Adenina
• Timina
• Citosina
• Guanina
                `,

                "ARN": `
El ARN participa en diferentes procesos relacionados
con la expresión de la información genética.

Sus bases son:

• Adenina
• Uracilo
• Citosina
• Guanina

En ARN encontramos uracilo en lugar de timina.
                `,

                "Complementariedad": `
En el ADN:

Adenina ↔ Timina
Citosina ↔ Guanina

Esta complementariedad permite la formación de la
estructura característica de la doble hélice.
                `
            }

            introduccion: `
El metabolismo es el conjunto de reacciones químicas
que ocurren en las células.

Se puede dividir en:

• Catabolismo
• Anabolismo
            `,

            conceptos: {

                "Catabolismo": `
El catabolismo corresponde a procesos que degradan
moléculas complejas en moléculas más simples.

Generalmente estos procesos liberan energía.
                `,

                "Anabolismo": `
El anabolismo corresponde a procesos de construcción
de moléculas complejas a partir de moléculas más simples.

Generalmente requiere energía.
                `,

                "ATP": `
El ATP es una molécula fundamental para la transferencia
de energía en las células.

Muchos procesos celulares utilizan energía proporcionada
por la hidrólisis del ATP.
                `,

De forma simplificada, la degradación de glucosa puede
involucrar:

Glucólisis
↓
Oxidación del piruvato
↓
Ciclo de Krebs
↓
Cadena respiratoria

Estos procesos permiten obtener energía celular.
                `
            }
        }
    };

    // =========================================================
    // PROGRESO

    function crearProgreso() {

        let datos = {};

        TEMAS.forEach(tema => {

            datos[tema] = {
                correctas: 0,
                incorrectas: 0
            };

        });

        return datos;
    }


    let progreso =
        JSON.parse(
            localStorage.getItem("bioquimicaProgreso")
        ) || crearProgreso();


    function guardarProgreso() {

        localStorage.setItem(
            "bioquimicaProgreso",
            JSON.stringify(progreso)
        );

    }


    // =========================================================
    // UTILIDADES

    const app = document.getElementById("app");


    function limpiar() {

        app.innerHTML = "";

    }


    function pantallaBase() {

        const pantalla = document.createElement("div");

        pantalla.className = "pantalla";

        app.appendChild(pantalla);

        return pantalla;

    }


    function boton(texto, funcion, clase = "") {

        const b = document.createElement("button");

        b.innerHTML = texto;

        b.className = clase;

        b.onclick = funcion;

        return b;

    }


    function titulo(texto, subtitulo = null) {

        const h = document.createElement("div");

        h.className = "titulo";

        h.innerHTML = texto;

        if (subtitulo) {

            const s = document.createElement("div");

            s.className = "subtitulo";

            s.innerHTML = subtitulo;

            h.appendChild(s);
        }

        return h;

    // =========================================================

    // =========================================================

    function responder(respuesta) {

        const pregunta =
            preguntasQuiz[indicePregunta];

        const tema = pregunta.tema;


        if (respuesta === pregunta.respuesta) {

            puntaje++;

            progreso[tema].correctas++;

            guardarProgreso();

            mostrarResultado(
                true,
                pregunta.explicacion
            );

        } else {

            progreso[tema].incorrectas++;

            guardarProgreso();

            mostrarResultado(
                false,
                `La respuesta correcta es: <b>${pregunta.respuesta}</b><br><br>${pregunta.explicacion}`
            );

        }

    }

    // =========================================================
    // REPASAR ERRORES
    // =========================================================

    function repasarErrores() {

        const temasDebiles =
            TEMAS.filter(tema => {

                const correctas =
                    progreso[tema].correctas;

                const incorrectas =
                    progreso[tema].incorrectas;

                const total =
                    correctas + incorrectas;

                if (total === 0)
                    return false;

                return (
                    correctas / total * 100
                    < 70
                );

            });


        if (temasDebiles.length === 0) {

            alert(
                "🎉 ¡Muy bien!\n\n" +
                "No tienes temas con menos de 70% de dominio."
            );

            return;

        }


        preguntasQuiz =
            PREGUNTAS.filter(
                p => temasDebiles.includes(p.tema)
            );


        preguntasQuiz.sort(
            () => Math.random() - 0.5
        );


        indicePregunta = 0;

        puntaje = 0;

        mostrarPregunta();

    }


    // =========================================================

    // =========================================================

    function menuProgreso() {

        limpiar();

        const pantalla = pantallaBase();


        pantalla.appendChild(
            titulo(
                "📊 MI PROGRESO",
                "Tu rendimiento por área"
            )
        );


        let totalCorrectas = 0;

        let totalIncorrectas = 0;


        TEMAS.forEach(tema => {

            const correctas =
                progreso[tema].correctas;

            const incorrectas =
                progreso[tema].incorrectas;

            const total =
                correctas + incorrectas;


            totalCorrectas += correctas;

            totalIncorrectas += incorrectas;


            const porcentaje =
                total > 0
                    ? correctas / total * 100
                    : 0;


            const fila =
                document.createElement("div");

            fila.className =
                "fila-progreso";


            const nombre =
                document.createElement("div");

            nombre.className =
                "nombre-tema";

            nombre.innerHTML =
                `${ICONOS[tema]} ${tema}`;


            fila.appendChild(nombre);


            const barra =
                document.createElement("div");

            barra.className =
                "barra";


            const progresoBarra =
                document.createElement("div");

            progresoBarra.className =
                "barra-progreso";

            progresoBarra.style.width =
                `${porcentaje}%`;


            if (porcentaje >= 80) {

                progresoBarra.style.background =
                    "#36D399";

            } else if (porcentaje >= 60) {

                progresoBarra.style.background =
                    "#FBBF24";

            } else {

                progresoBarra.style.background =
                    "#F87171";

            }


            barra.appendChild(
                progresoBarra
            );


            fila.appendChild(barra);


            const porcentajeTexto =
                document.createElement("div");

            porcentajeTexto.className =
                "porcentaje";

            porcentajeTexto.innerHTML =
                `${porcentaje.toFixed(0)}%`;


            fila.appendChild(
                porcentajeTexto
            );


            pantalla.appendChild(fila);

        });


        const total =
            totalCorrectas +
            totalIncorrectas;


        const dominio =
            total > 0
                ? totalCorrectas / total * 100
                : 0;


        const nivel =
            document.createElement("div");

        nivel.className = "nivel";


        let nombreNivel;


        if (dominio >= 90) {

            nombreNivel =
                "🏆 Maestro de la Bioquímica";

        } else if (dominio >= 75) {

            nombreNivel =
                "🔥 Bioquímico avanzado";

        } else if (dominio >= 60) {

            nombreNivel =
                "🧪 Bioquímico en progreso";

        } else {

            nombreNivel =
                "📚 Aprendiz de bioquímica";

        }


        nivel.innerHTML =
            `${nombreNivel}<br>
             <small>Dominio general: ${dominio.toFixed(1)}%</small>`;


        pantalla.appendChild(nivel);


        const acciones =
            document.createElement("div");

        acciones.className =
            "fila-botones";


        acciones.appendChild(
            boton(
                "🗑 Reiniciar progreso",
                reiniciarProgreso
            )
        );


        acciones.appendChild(
            boton(
                "← Volver",
                mostrarInicio
            )
        );


        pantalla.appendChild(acciones);

    }

        progreso = crearProgreso();
